
name: Build EmuHost APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project ZIP
        run: |
          unzip -q EmuHost-fixed-source.zip -d source
          find source -name settings.gradle.kts

      - name: Build APK
        run: |
          PROJECT=$(find source -name settings.gradle.kts -printf '%h\n' | head -1)
          cd "$PROJECT"
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: EmuHost-debug-apk
          path: source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
